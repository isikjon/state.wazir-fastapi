# NGINX конфигурация для медиа-сервера
# Заменяет .htaccess файл

server {
    listen 80;
    listen 443 ssl;
    server_name wazir.kg;
    
    root /var/www/html;
    index index.php index.html index.htm;
    
    # Увеличиваем лимиты для загрузки файлов (300MB)
    client_max_body_size 300M;
    
    # Таймауты для больших загрузок
    client_body_timeout 300s;
    client_header_timeout 300s;
    
    # Основное расположение для state приложения
    location /state/ {
        try_files $uri $uri/ =404;
        
        # CORS заголовки для всех запросов
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-Forwarded-For' always;
        add_header 'Access-Control-Max-Age' '86400' always;
        
        # Обработка OPTIONS запросов (preflight)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-Forwarded-For';
            add_header 'Access-Control-Max-Age' '86400';
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' '0';
            return 204;
        }
        
        # Обработка PHP файлов
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/var/run/php/php5.6-fpm.sock;  # Или php7.x-fpm.sock в зависимости от версии
            fastcgi_index index.php;
            
            # Увеличиваем таймауты для PHP
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
            
            # Увеличиваем размер буферов
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 32k;
            fastcgi_busy_buffers_size 64k;
            
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            
            # CORS заголовки для PHP ответов
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-Forwarded-For' always;
            add_header 'Access-Control-Max-Age' '86400' always;
        }
    }
    
    # Обслуживание загруженных файлов
    location /state/uploads/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header 'Access-Control-Allow-Origin' '*' always;
    }
    
    # Логи для отладки
    access_log /var/log/nginx/state_access.log;
    error_log /var/log/nginx/state_error.log;
}

